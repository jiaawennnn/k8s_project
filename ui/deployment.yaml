apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui
        image: yoshana/ui:latest # Replace with your built UI image
        ports:
        - containerPort: 5000
        imagePullPolicy: Always
