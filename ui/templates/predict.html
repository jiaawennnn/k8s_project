<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}" class="home-icon" title="Home">&#8962;</a> 
            <div class="nav-links">
                <a href="{{ url_for('prediction_page') }}" class="{% if current_page == 'predict' %}active{% endif %}">Predict</a>
                <span class="separator">|</span>
                <a href="{{ url_for('history') }}" class="{% if current_page == 'history' %}active{% endif %}">History</a>
                <span class="separator">|</span>
                <a href="{{ url_for('traffic') }}" class="{% if current_page == 'traffic' %}active{% endif %}">Traffic Monitoring</a>
            </div>
        </nav>
    </header>
    
    <h2 class="upload-title">Upload any image to start prediction!</h2>

    <div id="preview" style="display:none;">
        <p>Image chosen for prediction</p>
        <img id="previewImg" src="" style="width: 100%;">
    </div>

    <form action="/predict" method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required id="imageInput">
        <input type="submit" value="Submit"/>
    </form>

    
    {% if image_bytes %}
    <h2>Prediction Result</h2>
    <table>
        <tr>
            <th>Image</th>
            <th>Label</th>
            <th>Confidence</th>
            <th>Time</th>
        </tr>
        <tr>
            <td><img src="{{ image_bytes }}" style="width:100px;"></td>
            <td><strong>{{ label }}</strong></td>
            <td><strong>{{ confidence | round(2) }}</strong></td>
            <td><strong>{{ timestamp }}</strong></td>
        </tr>
    </table>
    
    <div> 
        <form action="{{ url_for('submit_feedback') }}" method="POST">
            <input type="hidden" name="prediction_id" value="{{ prediction_id }}">
            <button type="submit" name="feedback" value="👍">👍</button>
            <button type="submit" name="feedback" value="👎">👎</button>
            <button type="submit" name="feedback" value="❓">❓</button>
        </form>
    </div>
    {% endif %}

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const previewImg = document.getElementById('previewImg');

        imageInput.addEventListener('change', function(){
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e){
                    previewImg.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
                previewImg.src = '';
            }
        });
    </script>
        
</body>
    

</html>
