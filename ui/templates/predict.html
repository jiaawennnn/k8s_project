<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Predictor</title>
</head>

<body>
    <header>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('prediction_page') }}">Prediction</a>
            <a href="{{ url_for('history') }}">History</a>
        </nav>
    </header>
    
    <h2>Upload any image to start prediction!</h2>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required>
        <input type="submit" value="Submit"/>
    </form>

    {% if image_bytes %}
    <h2>Prediction Result</h2>
    <table>
    <tr>
        <th>Image</th>
        <th>Label</th>
        <th>Confidence</th>
        <th>Time</th>
    </tr>

    <tr>
        <td><img src="{{ image_bytes }}" style="width:100px;"></td>
        <td><strong>{{ label }}</strong></td>
        <td><strong>{{ confidence | round(2) }}</strong></td>
        <td><strong>{{ timestamp }}</strong></td>
        
    </tr>

    {% else %}
    <tr>
        <td colspan="4">No prediction result yet.</td>
    </tr>
    {% endif %}
        
</body>
    

</html>
