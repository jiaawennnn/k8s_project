apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      containers:
      - name: inference
        image: yoshana/inference-image:latest #adjust the dockerhub username accordingly
        imagePullPolicy: Always 
        ports:
        - containerPort: 5003
        env:
        - name: MODEL_PATH
          value: "saved_model/ai_vs_real_detector.h5"
        - name: PREPROCESSING_URL
          value: "http://preprocess-svc:5001/preprocess"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        #for self healing
        livenessProbe:  
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: model-storage
          mountPath: /inference/model
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: model-pvc
